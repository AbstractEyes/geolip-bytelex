[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "geolip-bytelex"
version = "0.1.0"
description = "bytelex — universal, model-free relational system over byte information: alphabet-parametric gram statistics, corpus-entropy boundaries, and full-vocabulary token translation matrices for ByteLM distillation."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "AbstractPhil" }]
# Core is intentionally dependency-free (pure stdlib): portable anywhere.
dependencies = []

[project.optional-dependencies]
hub = ["huggingface_hub>=0.24"]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/AbstractEyes/geolip-bytelex"
Artifacts = "https://huggingface.co/AbstractPhil/geolip-bytelex"

[tool.setuptools.packages.find]
include = ["geolip*"]
namespaces = true
